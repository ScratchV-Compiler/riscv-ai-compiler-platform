{% extends 'base.html' %}
{% block title %}{{ code }} · 出错了{% endblock %}

{% block content %}
<div class="page-head">
  <h1>{{ code }} · {{ title }}</h1>
  <p class="lede">{{ detail }}</p>
</div>

<section class="panel">
  <div class="panel-body">
    <p class="mb-3">可以试试：</p>
    <ul>
      <li>回到 <a href="{{ url_for('index') }}">首页</a>，从导航重新进入。</li>
      <li>如果你在找某一次提交的结果，确认链接里的提交编号是否完整。</li>
      <li>确认问题仍在，把当前 URL 和大致时间发给赛事群，我们来查。</li>
    </ul>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-brand btn-sm" href="{{ url_for('index') }}">返回首页</a>
      <a class="btn btn-quiet btn-sm" href="{{ url_for('standings_page') }}">看排行榜</a>
    </div>
  </div>
</section>
{% endblock %}
