{% extends 'base.html' %}
{% block title %}找回密码 · RISC-V AI 编译器比赛平台{% endblock %}

{% block content %}
<div class="page-head">
  <h1>找回密码</h1>
  <p class="lede">填写注册邮箱，我们会给你发送一封带重置链接的邮件。</p>
</div>

<section class="panel auth-panel">
  <div class="panel-head"><h2>申请重置链接</h2></div>
  <div class="panel-body">
    <form method="post" action="{{ url_for('auth.forgot_password_page') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label" for="email">注册邮箱 <span class="req">*</span></label>
        <input class="form-control" type="email" id="email" name="email" required
               autocomplete="username" inputmode="email" autofocus
               value="{{ form.email if form else '' }}">
        <div class="form-hint">链接 30 分钟内有效，且只能使用一次。</div>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2">
        <button class="btn btn-brand" type="submit">发送重置链接</button>
        <span class="small">想起来了？<a href="{{ url_for('auth.login_page') }}">返回登录</a></span>
      </div>
    </form>
  </div>
</section>
{% endblock %}
