{% extends 'base.html' %}
{% block title %}设置新密码 · RISC-V AI 编译器挑战赛{% endblock %}

{% block content %}
<div class="page-head">
  <h1>设置新密码</h1>
  <p class="lede">为你的账号设置一个新密码，设置后需用新密码重新登录。</p>
</div>

<section class="panel auth-panel">
  <div class="panel-head"><h2>重置密码</h2></div>
  <div class="panel-body">
    <form method="post" action="{{ url_for('auth.reset_password_page') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <label class="form-label" for="password">新密码 <span class="req">*</span></label>
          <input class="form-control" type="password" id="password" name="password"
                 required minlength="8" autocomplete="new-password" autofocus>
          <div class="form-hint">至少 8 位。</div>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="password2">确认新密码 <span class="req">*</span></label>
          <input class="form-control" type="password" id="password2" name="password2"
                 required minlength="8" autocomplete="new-password">
        </div>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
        <button class="btn btn-brand" type="submit">设置新密码</button>
        <span class="small"><a href="{{ url_for('auth.forgot_password_page') }}">重新申请链接</a></span>
      </div>
    </form>
  </div>
</section>
{% endblock %}
