<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISC-V AI 编译器比赛 · 在线评测</title>
    <!-- Bootstrap 5 (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">🧩 RISC-V AI 编译器挑战赛</h1>
        <p class="text-center text-muted">提交你的编译器优化代码，实时刷新排行榜</p>

        <div class="row mt-5">
            <!-- 左侧：提交表单 -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        提交新版本
                    </div>
                    <div class="card-body">
                        <form id="submitForm">
                            <div class="mb-3">
                                <label for="team" class="form-label">队伍名称</label>
                                <input type="text" class="form-control" id="team" placeholder="例如：RISC-V 先锋队" required>
                            </div>
                            <div class="mb-3">
                                <label for="problem" class="form-label">选择赛题</label>
                                <select class="form-select" id="problem" required>
                                    <option value="fwht">赛题一：哈达玛变换 (FWHT)</option>
                                    <option value="conv">赛题二：Winograd 卷积</option>
                                    <option value="spmv">赛题三：稀疏矩阵乘 (SpMV)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="codeFile" class="form-label">上传代码（Python 文件）</label>
                                <input class="form-control" type="file" id="codeFile" accept=".py" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="submitBtn">
                                ⚡ 提交评测
                            </button>
                        </form>
                        <div id="submitStatus" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：排行榜 -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        🏆 当前排行榜（自动刷新）
                    </div>
                    <div class="card-body" id="leaderboardContainer">
                        <p class="text-muted">选择赛题后点击 “刷新”</p>
                        <table class="table table-sm table-striped" id="leaderboardTable">
                            <thead><tr><th>#</th><th>队伍</th><th>得分</th><th>时间</th></tr></thead>
                            <tbody id="leaderboardBody"></tbody>
                        </table>
                        <button class="btn btn-outline-secondary btn-sm" id="refreshLb">🔄 刷新</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- 提交 ----------
        const form = document.getElementById('submitForm');
        const statusDiv = document.getElementById('submitStatus');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const team = document.getElementById('team').value.trim();
            const problem = document.getElementById('problem').value;
            const fileInput = document.getElementById('codeFile');
            if (!team || !fileInput.files.length) {
                statusDiv.innerHTML = '<div class="alert alert-warning">请完整填写信息并选择文件</div>';
                return;
            }

            const formData = new FormData();
            formData.append('team', team);
            formData.append('problem', problem);
            formData.append('code', fileInput.files[0]);

            statusDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div> 提交中...';
            document.getElementById('submitBtn').disabled = true;

            try {
                const resp = await fetch('/api/submit', { method: 'POST', body: formData });
                const data = await resp.json();
                if (resp.ok) {
                    const subId = data.submission_id;
                    statusDiv.innerHTML = `<div class="alert alert-success">✅ 提交成功！评测 ID: ${subId}。 <a href="/result/${subId}">查看结果</a></div>`;
                    // 自动跳转到结果页面
                    window.location.href = `/result/${subId}`;
                } else {
                    statusDiv.innerHTML = `<div class="alert alert-danger">❌ 提交失败: ${data.error || '未知错误'}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="alert alert-danger">网络错误，请重试</div>`;
            }
            document.getElementById('submitBtn').disabled = false;
        });

        // ---------- 排行榜 ----------
        async function loadLeaderboard(problem = 'fwht') {
            const resp = await fetch(`/api/leaderboard/${problem}`);
            if (!resp.ok) return;
            const data = await resp.json();
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            data.slice(0, 10).forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${idx+1}</td><td>${item.team}</td><td>${item.score.toFixed(2)}</td><td>${new Date(item.created_at).toLocaleString()}</td>`;
                tbody.appendChild(tr);
            });
        }

        // 默认加载 fwht
        document.getElementById('problem').addEventListener('change', (e) => {
            loadLeaderboard(e.target.value);
        });
        document.getElementById('refreshLb').addEventListener('click', () => {
            const p = document.getElementById('problem').value;
            loadLeaderboard(p);
        });
        // 初始加载
        loadLeaderboard('fwht');
    </script>
</body>
</html>
