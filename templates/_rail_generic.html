{# 通用右栏：用于**不在任何场次内**的页面（赛事目录、登录/注册等）。
   这里不放「本场次/配额/评分口径」——那些是场次内的信息，摆在目录页会把
   默认场次误当成「当前场次」。 #}
<div class="panel">
  <div class="panel-head"><h2>多场竞赛</h2></div>
  <div class="panel-body">
    <p class="mb-2">
      平台同时承载多场竞赛。每场有<strong>独立的赛题、榜单与队伍</strong>——
      先在场次列表里选一场，再进入它的赛题与排行榜。
    </p>
    <p class="text-body-secondary small mb-0">
      同一道题在不同场次可以跑在不同数据上；账号是全局的，一个人可在多场各加入一支队伍。
    </p>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h2>怎么开始</h2></div>
  <div class="panel-body">
    <ol class="mb-0 small">
      <li>在上方「场次列表」里<strong>选一场</strong>进入；</li>
      <li>看<strong>赛题</strong>与评测约定；</li>
      <li>登录并<strong>组队</strong>后到<strong>提交</strong>页交代码；</li>
      <li>在<strong>排行榜</strong>看名次（逐数据点可追）。</li>
    </ol>
  </div>
</div>
