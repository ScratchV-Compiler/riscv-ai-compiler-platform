{% extends 'base.html' %}
{% block title %}注册 · RISC-V AI 编译器挑战赛{% endblock %}

{% block content %}
<div class="page-head">
  <h1>注册</h1>
  <p class="lede">面向华东师范大学全日制在读学生。每场次每人限参加一支队伍（每队 1~3 人）。</p>
</div>

<section class="panel auth-panel">
  <div class="panel-head"><h2>创建账号</h2></div>
  <div class="panel-body">
    <form method="post" action="{{ url_for('auth.register_page') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label" for="email">邮箱 <span class="req">*</span></label>
        <input class="form-control" type="email" id="email" name="email" required
               autocomplete="username" inputmode="email"
               value="{{ form.email if form else '' }}">
        <div class="form-hint">作为登录账号；不强制校内邮箱。</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="name">姓名 <span class="req">*</span></label>
        <input class="form-control" type="text" id="name" name="name" required
               maxlength="40" autocomplete="name"
               value="{{ form.name if form else '' }}">
        <div class="form-hint">请填写真实姓名，用于赛后核验。</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="student_id">学号</label>
        <input class="form-control" type="text" id="student_id" name="student_id"
               inputmode="numeric" pattern="[0-9]{6,12}" value="{{ form.student_id if form else '' }}">
        <div class="form-hint">选填，6–12 位数字。</div>
      </div>

      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <label class="form-label" for="password">密码 <span class="req">*</span></label>
          <input class="form-control" type="password" id="password" name="password"
                 required minlength="8" autocomplete="new-password">
          <div class="form-hint">至少 8 位。</div>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="password2">确认密码 <span class="req">*</span></label>
          <input class="form-control" type="password" id="password2" name="password2"
                 required minlength="8" autocomplete="new-password">
        </div>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
        <button class="btn btn-brand" type="submit">注册并登录</button>
        <span class="small">已有账号？<a href="{{ url_for('auth.login_page') }}">去登录</a></span>
      </div>
    </form>
  </div>
</section>
{% endblock %}
