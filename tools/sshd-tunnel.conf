# 部署位置：/etc/ssh/sshd_config.d/10-tunnel.conf
# 由 tools/add_tunnel_user.sh 配套使用；改完务必 `sshd -t` 校验再 reload。
# 本文件是仓库副本，便于重建环境。
# 隧道专用账号：只能把端口转发到本机 5000，不能拿 shell。
# 由平台维护者添加（tools/add_tunnel_user.sh）；撤销只需把用户移出 tunnel 组。
#
# 注意：本文件被 /etc/ssh/sshd_config 第 12 行的 Include 引入。sshd 对同一关键字
# 取「先出现的值」，所以这里的 Match 块对 tunnel 组账号优先生效。
Match Group tunnel
    # 只允许本地转发（-L），不允许远程转发（-R）与动态转发（-D）
    AllowTcpForwarding local
    # 只能转发到平台的 gunicorn —— 转发到别处一律拒绝
    PermitOpen 127.0.0.1:5000
    # 强制密钥认证，禁用密码
    PasswordAuthentication no
    PubkeyAuthentication yes
    # 不给终端、不做 X11/agent 转发、不建隧道设备
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
